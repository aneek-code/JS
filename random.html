<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="randomstyle.css">
</head>
<body>
    <button id="change-back">Magic!</button>
    <br>
    <button id="dec">-</button>
    <p id="counter">0</p>
    <button id="inc">+</button>
    <button id="res">reset</button>
    <br>
    <div id="clock"></div>

    <h1>TO-DO LIST</h1>
    <div class="task">
        <input type="text" placeholder="enter your task" id="area">
        <input type="checkbox" value="done" id="btn">Done</button>
        <button class="del">Delete task</button>
    </div>
    <button id="add">Add task</button>
    <div class="calculator">

        <div id="dis">0</div>

    <button class="number">1</button>
    <button class="number">2</button>
    <button class="number">3</button>
    <button class="number">4</button>
    <button class="number">5</button>
    <button class="number">6</button>
    <button class="number">7</button>
    <button class="number">8</button>
    <button class="number">9</button>

    <button class="operator">+</button>
    <button class="operator">-</button>
    <button class="operator">*</button>
    <button class="operator">/</button>

    <button id="equal">=</button>
    <button id="clear">C</button>

</div>
    <script src="randomscript.js"></script>
</body>
</html>
