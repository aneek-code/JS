<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="randomstyle.css">
</head>
<body>
    <button id="change-back">Magic!</button>
    <br>
    <button id="dec">-</button>
    <p id="counter">0</p>
    <button id="inc">+</button>
    <button id="res">reset</button>
    <br>
    <div id="clock"></div>

    <h1>TO-DO LIST</h1>
    <div class="task">
        <input type="text" placeholder="enter your task" id="area">
        <input type="checkbox" value="done" id="btn">Done</button>
        <button class="del">Delete task</button>
    </div>
    <button id="add">Add task</button>
    <script src="randomscript.js"></script>
</body>
</html>
